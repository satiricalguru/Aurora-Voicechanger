<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Aurora Voice: become anyone, in real time">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000"/>
      <stop offset=".45" stop-color="#0b1a48"/>
      <stop offset=".72" stop-color="#3a3f93"/>
      <stop offset=".88" stop-color="#9a7fd6"/>
      <stop offset="1" stop-color="#f6d5ec"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="100%" r="70%">
      <stop offset="0" stop-color="#b855e7" stop-opacity=".55"/>
      <stop offset="1" stop-color="#b855e7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="curtain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5fd3ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#7d8bff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#e58bff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="400" rx="28"/></clipPath>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <style>
    .t{font:700 84px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-4px;fill:#fff}
    .s{font:500 26px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-.5px;fill:#fff;fill-opacity:.72}
    .m{font:500 15px ui-monospace,'SF Mono',Menlo,Consolas,monospace;letter-spacing:2px;fill:#fff;fill-opacity:.6}
    .b{transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.6s ease-in-out infinite alternate}
    @keyframes eq{0%{transform:scaleY(.18)}100%{transform:scaleY(1)}}
    .c1{animation:drift 14s ease-in-out infinite alternate}
    .c2{animation:drift 18s ease-in-out infinite alternate-reverse}
    @keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(160px)}}
    .dot{animation:pulse 1.6s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.25}}
    @media (prefers-reduced-motion:reduce){.b,.c1,.c2,.dot{animation:none}}
  </style>
  <g clip-path="url(#card)">
    <rect width="1280" height="400" fill="url(#sky)"/>
    <rect width="1280" height="400" fill="url(#glow)"/>
    <g filter="url(#soft)">
      <path class="c1" d="M-200 250 C 150 120, 420 300, 700 170 S 1200 140, 1480 230 L1480 300 C 1200 230, 950 270, 700 250 S 150 200, -200 330 Z" fill="url(#curtain)"/>
      <path class="c2" d="M-200 300 C 200 220, 500 330, 800 240 S 1250 230, 1480 290 L1480 340 C 1200 300, 900 330, 700 310 S 200 280, -200 360 Z" fill="url(#curtain)" opacity=".7"/>
    </g>
    <g transform="translate(0 0)">
      <circle class="dot" cx="96" cy="74" r="5" fill="#0088ff"/>
      <text class="m" x="112" y="79">REAL-TIME VOICE CHANGER · MACOS</text>
      <text class="t" x="90" y="190">Aurora Voice</text>
      <text class="s" x="94" y="238">Become anyone. In real time.</text>
    </g>
    <g fill="url(#bar)">
      <rect class="b" x="820" y="120" width="12" height="190" rx="6" style="animation-delay:-.1s;animation-duration:1.1s"/>
      <rect class="b" x="844" y="120" width="12" height="190" rx="6" style="animation-delay:-.5s;animation-duration:1.4s"/>
      <rect class="b" x="868" y="120" width="12" height="190" rx="6" style="animation-delay:-.9s;animation-duration:.9s"/>
      <rect class="b" x="892" y="120" width="12" height="190" rx="6" style="animation-delay:-.3s;animation-duration:1.7s"/>
      <rect class="b" x="916" y="120" width="12" height="190" rx="6" style="animation-delay:-1.2s;animation-duration:1.2s"/>
      <rect class="b" x="940" y="120" width="12" height="190" rx="6" style="animation-delay:-.7s;animation-duration:1s"/>
      <rect class="b" x="964" y="120" width="12" height="190" rx="6" style="animation-delay:-.2s;animation-duration:1.5s"/>
      <rect class="b" x="988" y="120" width="12" height="190" rx="6" style="animation-delay:-1s;animation-duration:1.3s"/>
      <rect class="b" x="1012" y="120" width="12" height="190" rx="6" style="animation-delay:-.4s;animation-duration:.95s"/>
      <rect class="b" x="1036" y="120" width="12" height="190" rx="6" style="animation-delay:-.8s;animation-duration:1.6s"/>
      <rect class="b" x="1060" y="120" width="12" height="190" rx="6" style="animation-delay:-.15s;animation-duration:1.15s"/>
      <rect class="b" x="1084" y="120" width="12" height="190" rx="6" style="animation-delay:-.6s;animation-duration:1.35s"/>
      <rect class="b" x="1108" y="120" width="12" height="190" rx="6" style="animation-delay:-1.1s;animation-duration:1.05s"/>
      <rect class="b" x="1132" y="120" width="12" height="190" rx="6" style="animation-delay:-.35s;animation-duration:1.45s"/>
      <rect class="b" x="1156" y="120" width="12" height="190" rx="6" style="animation-delay:-.75s;animation-duration:1.25s"/>
    </g>
  </g>
</svg>
