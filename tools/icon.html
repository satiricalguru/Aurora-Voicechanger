<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1024px;height:1024px;background:transparent;overflow:hidden}
.tile{position:absolute;left:100px;top:100px;width:824px;height:824px;border-radius:185px;overflow:hidden;
 background:linear-gradient(180deg,#000 0%,#030719 30%,#112d72 62%,#4b52aa 78%,#a887dc 90%,#fcdbef 100%);
 box-shadow:0 30px 60px rgba(0,0,0,.45), inset 0 0 0 2px rgba(255,255,255,.08)}
.orb{position:absolute;left:212px;top:150px;width:400px;height:400px;border-radius:50%;
 background:
  radial-gradient(circle at 32% 26%,rgba(255,255,255,.95) 0,rgba(255,255,255,0) 26%),
  radial-gradient(circle at 72% 82%,#ff4704 0,transparent 55%),
  radial-gradient(circle at 22% 78%,#b855e7 0,transparent 60%),
  radial-gradient(circle at 80% 30%,#ffb764 0,transparent 45%),
  radial-gradient(circle at 30% 40%,#7a5cff 0,transparent 60%),
  linear-gradient(160deg,#0447ff 0%,#b855e7 45%,#ff4704 85%);
 box-shadow:inset -40px -50px 90px rgba(0,0,0,.45),0 40px 120px -20px rgba(184,85,231,.9)}
.wave{position:absolute;left:0;right:0;bottom:120px;height:160px;display:flex;align-items:center;justify-content:center;gap:22px}
.wave i{display:block;width:26px;border-radius:13px;background:#fff;opacity:.95}
</style></head><body><div class="tile"><div class="orb"></div>
<div class="wave"><i style="height:40px"></i><i style="height:90px"></i><i style="height:150px"></i><i style="height:110px"></i><i style="height:60px"></i><i style="height:120px"></i><i style="height:40px"></i></div></div></body></html>
